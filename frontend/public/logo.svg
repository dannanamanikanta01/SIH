<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Scan Glow Gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Subtle Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="116" height="116" rx="26" fill="none" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.4" />

  <!-- Packaged Commodity Box (Isometric) -->
  <g transform="translate(64, 52)" filter="url(#shadow)">
    <!-- Top Face -->
    <polygon points="0,-24 26,-11 0,2 -26,-11" fill="#93c5fa" fill-opacity="0.3" stroke="#e0f2fe" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Left Face -->
    <polygon points="-26,-11 0,2 0,28 -26,15" fill="#3b82f6" fill-opacity="0.35" stroke="#e0f2fe" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Right Face -->
    <polygon points="0,2 26,-11 26,15 0,28" fill="#1d4ed8" fill-opacity="0.45" stroke="#e0f2fe" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Box Tape -->
    <line x1="0" y1="-24" x2="0" y2="2" stroke="#60a5fa" stroke-width="2" stroke-dasharray="3,2" />
  </g>

  <!-- Optical Scan Line Beam -->
  <line x1="18" y1="52" x2="110" y2="52" stroke="url(#scanGrad)" stroke-width="3" stroke-linecap="round" />
  <circle cx="64" cy="52" r="3" fill="#38bdf8" />

  <!-- Legal Metrology Compliance Shield & Checkmark -->
  <g transform="translate(64, 82)" filter="url(#shadow)">
    <!-- Shield -->
    <path d="M 0,-18 L 18,-10 C 18,8 10,20 0,24 C -10,20 -18,8 -18,-10 Z" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="2.8" stroke-linejoin="round" />
    <!-- Checkmark -->
    <path d="M -7,3 L -2,8 L 8,-2" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Corner Calibration Marks -->
  <circle cx="22" cy="22" r="2.5" fill="#38bdf8" fill-opacity="0.7" />
  <circle cx="106" cy="22" r="2.5" fill="#38bdf8" fill-opacity="0.7" />
</svg>
